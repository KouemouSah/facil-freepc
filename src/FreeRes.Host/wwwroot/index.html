<!doctype html>

  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="shell">
    <header class="top">
      <img class="brand" src="logo.png" alt="Facil" width="118" height="50">
      <div>
        <h1>FreePC</h1>
        <span id="version" class="muted">…</span>

        <dt>Machine</dt><dd id="machine">…</dd>
