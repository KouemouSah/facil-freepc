# Integration continue : compilation (avertissements = erreurs) + tests .NET et extension Firefox a chaque push / PR.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Compilation
        run: dotnet build FreeRes.sln -c Release -nologo
      # Les tests d'interface (FreeRes.Ui.Tests) pilotent Microsoft Edge, preinstalle sur windows-latest (canal msedge).
      - name: Tests .NET
        run: dotnet test FreeRes.sln -c Release --no-build -nologo --logger "trx;LogFilePrefix=tests"
      - name: Tests et validation de l'extension Firefox
        shell: pwsh
        run: |
          # pwsh ne juge l'etape que sur la DERNIERE commande : chaque commande native verifie donc son code de sortie.
          # Liste explicite de fichiers : Node >= 21 lit les arguments comme des motifs glob et ne parcourt plus un dossier.
          $tests = @(Get-ChildItem extensions/firefox/test -Filter '*.test.cjs' -File | ForEach-Object { "extensions/firefox/test/$($_.Name)" })
          if ($tests.Count -eq 0) { throw 'Aucun test de l''extension Firefox trouve' }
          node --test @tests
          if ($LASTEXITCODE -ne 0) { throw "Tests de l'extension Firefox en echec (code $LASTEXITCODE)" }
          npx --yes web-ext@10.8.0 lint --source-dir extensions/firefox --ignore-files "test/**" --warnings-as-errors
          if ($LASTEXITCODE -ne 0) { throw "web-ext lint en echec (code $LASTEXITCODE)" }
      - name: Resultats de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
