# Integration continue : compilation (avertissements = erreurs) + tests .NET et extension Firefox a chaque push / PR.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compilation
        run: dotnet build FreeRes.sln -c Release -nologo
      # Les tests d'interface (FreeRes.Ui.Tests) pilotent Microsoft Edge, preinstalle sur windows-latest (canal msedge).
      - name: Tests .NET
        run: dotnet test FreeRes.sln -c Release --no-build -nologo --logger "trx;LogFilePrefix=tests"
      - name: Tests et validation de l'extension Firefox
        shell: pwsh
        run: |
          node --test extensions/firefox/test
          npx --yes web-ext@10.8.0 lint --source-dir extensions/firefox --ignore-files "test/**" --warnings-as-errors
      - name: Resultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
